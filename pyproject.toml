[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-mcp"
version = "0.1.0"
description = "A multi-service MCP server plus an AstrBot bridge plugin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Astrbot-MCP" }]
keywords = ["astrbot", "mcp", "model-context-protocol", "llm", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
  "PyYAML>=6.0.1",
  "pydantic>=2.7",
  "beautifulsoup4>=4.12",
  "icalendar>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
astrbot-mcp = "astrbot_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["astrbot_mcp", "astrbot_plugin"]

[tool.coverage.run]
source = ["astrbot_mcp"]
omit = ["*/__main__.py"]
