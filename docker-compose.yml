services:
  astrbot-mcp:
    build: .
    image: astrbot-mcp:latest
    container_name: astrbot-mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # Optional API keys / tokens. Leave empty to disable the related features.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BING_SEARCH_API_KEY: ${BING_SEARCH_API_KEY:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      ASTRBOT_MCP_AUTH_TOKEN: ${ASTRBOT_MCP_AUTH_TOKEN:-}
    volumes:
      # cp config.example.yaml config.yaml before the first start
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
